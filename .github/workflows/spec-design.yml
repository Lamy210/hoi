name: Specification Design
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specification-design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx openspec validate phase5-division-designer --strict
      - run: npx openspec validate phase6-equipment-lines --strict
      - run: npx openspec validate phase6-industrial-economy --strict
      - run: npx openspec validate phase5-army-command --strict
      - run: npx openspec validate map-frontline-draft-objective --strict
      - run: npx openspec validate prewar-front-and-offensive-line --strict
      - run: npx openspec validate atomic-map-front-formation --strict
      - run: npx openspec validate edit-existing-map-fronts --strict
      - run: npx openspec validate integrated-grand-strategy-foundations --strict
      - run: npx openspec validate tank-aircraft-designer-combined-arms-rd --strict
      - run: npx openspec validate map-marquee-formation-selection --strict
      - run: npx openspec validate formation-operation-scope-preview --strict
      - run: npx openspec validate front-attack-command-budget --strict
      - run: npx openspec validate rapid-province-capture --strict
      - run: npx openspec validate front-deployment-policies --strict
      - run: npx openspec validate progressive-front-advance --strict
      - run: npx openspec validate defense-counteroffensive-loop --strict
      - run: npx openspec validate entrenchment-planning-live-combat --strict
      - run: npx openspec validate live-defense-breakthrough-damage --strict
      - run: npx openspec validate frontline-reserve-rotation --strict
      - run: npx openspec validate bottom-army-group-command-dock --strict
      - run: npx openspec validate bottom-front-execution-controls --strict
      - run: npx openspec validate designated-area-garrison-v21 --strict
      - run: npx openspec validate phase8-maritime-catalog-loader --strict
      - run: npx openspec validate phase8-port-map-visualization --strict
      - run: npx openspec validate phase8-port-garrison-selection --strict
      - run: npx openspec validate garrison-coverage-visibility --strict
      - run: npx openspec validate on-demand-garrison-route-diagnostics --strict
      - run: npx openspec validate threat-aware-garrison-priorities --strict
      - run: npx openspec validate garrison-hostile-division-pressure --strict
      - run: npx openspec validate catalog-port-defense-priorities --strict
      - run: npx openspec validate garrison-batch-travel-optimization --strict
      - run: npx openspec validate garrison-route-estimated-days --strict
      - run: npx openspec validate garrison-reserve-pool-assignment --strict
      - run: npx openspec validate garrison-command-last-guard-validation --strict
