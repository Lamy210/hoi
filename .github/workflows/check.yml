name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      # lockfile が追加されたら npm ci に切り替える。
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - run: npx openspec validate release-github-pages --strict
      - run: npx openspec validate scenario-pack-integrity --strict
      - run: npx openspec validate playable-map-controls --strict
      - run: npx openspec validate save-session-recovery --strict
      - run: npx openspec validate division-training-production --strict
      - run: npx openspec validate formation-operation-scope-preview --strict
      - run: npx openspec validate front-attack-command-budget --strict
      - run: npx openspec validate map-marquee-formation-selection --strict
      - run: npx openspec validate map-frontline-draft-objective --strict
      - run: npx openspec validate prewar-front-and-offensive-line --strict
      - run: npx openspec validate atomic-map-front-formation --strict
      - run: npx openspec validate edit-existing-map-fronts --strict
      - run: npx openspec validate integrated-grand-strategy-foundations --strict
      - run: npx openspec validate tank-aircraft-designer-combined-arms-rd --strict
      - name: Upload verified production build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v5
